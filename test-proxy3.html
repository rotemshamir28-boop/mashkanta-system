<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>בדיקת PDF</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5;}
button{padding:14px 24px;font-size:16px;background:#3B6E5C;color:#fff;border:none;border-radius:8px;cursor:pointer;}
pre{background:#fff;border:1px solid #ccc;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-all;font-size:13px;margin-top:16px;}
</style>
</head>
<body>
<h2>בדיקת PDF מול הפרוקסי</h2>
<button id="btnUpload">בחר PDF לבדיקה</button>
<input type="file" id="fileInput" accept=".pdf,application/pdf" style="display:none">
<pre id="out">(עדיין לא נבדק)</pre>

<script>
const PROXY_URL = "https://withered-pine-d505.rotemshamir28.workers.dev";
const out = document.getElementById('out');

document.getElementById('btnUpload').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  out.textContent = 'גודל הקובץ המקורי: ' + (file.size/1024/1024).toFixed(2) + ' MB. קורא...';
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(',')[1];
    out.textContent += '\nגודל אחרי קידוד: ' + (base64.length/1024/1024).toFixed(2) + ' MB. שולח...';
    try{
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-5', max_tokens:50,
          messages:[{role:'user', content:[
            {type:'document', source:{type:'base64', media_type:'application/pdf', data:base64}},
            {type:'text', text:'כמה עמודים יש במסמך הזה? ענה במספר בלבד.'}
          ]}]
        })
      });
      out.textContent += '\n\nסטטוס: ' + res.status + '\n\n';
      out.textContent += await res.text();
    }catch(err){
      out.textContent += '\n\nשגיאה: ' + err.name + ': ' + err.message;
    }
  };
  reader.onerror = ()=>{ out.textContent = 'שגיאה בקריאת הקובץ'; };
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
